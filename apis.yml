apis:
- name: Waze Deep Links
  description: >-
    URL-invocation API to open the Waze app from an external link to locate an
    address, drop a pin, or start navigation. Query params include ll (lat,lon),
    q (search), navigate, z (zoom), favorite, and avoid_* / vehicle_type routing
    options. No authentication required.
  humanURL: https://developers.google.com/waze/deeplinks
  baseURL: https://waze.com/ul
  tags:
  - Navigation
  - Deep Links
  properties:
  - type: Documentation
    url: https://developers.google.com/waze/deeplinks
- name: Waze iFrame (Live Map)
  description: >-
    Embeddable client-side component that renders the interactive Waze Live Map
    inside a web page via an <iframe>, with zoom, lat, lon, pin, and desc
    parameters. No authentication required.
  humanURL: https://developers.google.com/waze/iframe
  baseURL: https://embed.waze.com/iframe
  tags:
  - Maps
  - Embed
  properties:
  - type: Documentation
    url: https://developers.google.com/waze/iframe
  - type: Components
    url: components/waze-components.yml
- name: Waze for Cities Data Feeds
  description: >-
    Partner data-exchange for road closures, incidents, and working vehicles
    using CIFS (preferred), WZDx, DATEX II, or ESRI formats; Waze returns a
    partner-specific JSON alerts feed. Provisioned through the Waze Partner Hub.
  humanURL: https://developers.google.com/waze/data-feed/overview
  baseURL: https://developers.google.com/waze/data-feed/overview
  tags:
  - Traffic
  - Smart Cities
  properties:
  - type: Documentation
    url: https://developers.google.com/waze/data-feed/overview
- name: Waze Transport SDK
  description: >-
    Partner-gated SDK for transportation apps to add ETA and routing points and
    trip-data collection using Waze real-time traffic and location data.
  humanURL: https://developers.google.com/waze/intro-transport
  baseURL: https://developers.google.com/waze/intro-transport
  tags:
  - Transportation
  - SDK
  properties:
  - type: Documentation
    url: https://developers.google.com/waze/intro-transport
