name: Waze
description: >-
  Waze is a Google-owned, community-driven navigation and real-time traffic
  application. Its developer surface is not a self-service JSON REST API but a
  set of public URL-invocation and embed contracts plus partner-gated data and
  SDK programs. Waze Deep Links open the Waze app from a URL to locate an
  address, drop a pin, or start turn-by-turn navigation; the Waze iFrame embeds
  the interactive Live Map in any web page; Waze for Cities Data Feeds let
  agencies exchange road-closure, incident, and working-vehicle data (CIFS,
  WZDx, DATEX II, ESRI) and receive a partner-specific JSON alerts feed; the
  Waze Transport SDK gives transportation apps ETA/routing and trip-data
  collection; and the Waze Audio Kit surfaces audio content in-drive. Developer
  documentation is hosted on Google for Developers at developers.google.com/waze
  and partner programs are provisioned through the Waze Partner Hub.
